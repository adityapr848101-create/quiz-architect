name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-size: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project & Add Platform
      run: |
        cordova create myapp com.example.myapp MyApp
        # आपकी वेबसाइट का कोड (index.html आदि) को cordova के www फोल्डर में कॉपी करना
        rm -rf myapp/www/*
        cp -r ./* myapp/www/ || true
        cd myapp
        cordova platform add android

    - name: Build Android App (APK)
      run: |
        cd myapp
        cordova build android --debug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app
        path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
